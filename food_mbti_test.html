<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="智味食空 · 美食MBTI人格测试 - 24个问题找到你的美食人格">
<meta property="og:title" content="智味食空 · 美食人格测试">

<title>智味食空 · 美食人格测试</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --primary: #1ca05c;
    --primary-dark: #158049;
    --primary-light: #e8f5e9;
    --primary-bg: #eaf7ee;
    --accent: #ffb74d;
    --bg: #fffef4;
    --bg-card: #FFFFFF;
    --text: #383838;
    --text-light: #666666;
    --text-muted: #999999;
    --gray-border: #dadbdb;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 12px;
    --radius-pill: 50px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100dvh;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ===== Background Overlay ===== */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('mbti_背景.svg') no-repeat center center;
    background-size: cover;
    pointer-events: none;
    z-index: 0;
  }

  body.showing-result::before {
    display: none;
  }

  #intro, #quiz, #result {
    position: relative;
    z-index: 1;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== Intro Page ===== */
  #intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    text-align: center;
  }

  .intro-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 5vw;
    gap: 3vh;
  }

  .intro-theme {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .intro-theme img {
    width: min(375px, 80vw);
    height: auto;
    display: block;
  }

  .intro-tagline {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: min(320px, 80vw);
  }

  .intro-tagline p {
    color: var(--text);
    font-size: 11px;
    line-height: 1.5;
    font-weight: 700;
    letter-spacing: 0.5px;
    width: 100%;
  }

  .intro-tagline p:last-child {
    font-weight: 700;
    font-size: 11px;
    color: var(--text);
  }

  .intro-bottom {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .intro-bottom-img {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex-shrink: 0;
  }

  .intro-bottom-img img {
    width: 150px;
    max-width: 100%;
    height: auto;
    display: block;
  }

  .btn-start {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: min(160px, 50vw);
    min-width: 120px;
    height: 44px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 20px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 20px rgba(28,160,92,0.35);
    font-family: inherit;
    letter-spacing: 2px;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn-start:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(28,160,92,0.3);
  }


  /* ===== Quiz Page ===== */
  #quiz {
    display: none;
    flex-direction: column;
  }

  .quiz-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: transparent;
    padding: calc(12px + var(--safe-top)) 5vw 0;
  }

  .quiz-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    height: 24px;
  }

  .quiz-q-number {
    font-size: 14px;
    font-weight: 600;
    color: #5f5f5e;
    text-shadow: 0 0 8px rgba(255,254,244,0.9), 0 0 4px rgba(255,254,244,0.95);
  }

  .quiz-progress-text {
    font-size: 12px;
    color: #5f5f5e;
    font-weight: 500;
    text-shadow: 0 0 8px rgba(255,254,244,0.9), 0 0 4px rgba(255,254,244,0.95);
  }

  .progress-bar-wrap {
    height: 10px;
    background: #e0e0e0;
    border-radius: 5px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #5f5f5e;
    border-radius: 5px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 10vw 100px;
    min-height: 0;
  }

  .question-number {
    display: none;
  }

  .question-text {
    font-size: clamp(22px, 6.5vw, 28px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    letter-spacing: 0.3px;
    text-shadow: 0 0 12px rgba(255,254,244,0.92), 0 0 6px rgba(255,254,244,0.96);
    text-align: left;
  }

  .question-box {
    height: 300px;
    width: 100%;
    padding-top: 50px;
    flex-shrink: 0;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: auto;
    padding-bottom: 20px;
    flex-shrink: 0;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
  }

  .option-btn {
    display: block;
    width: 100%;
    padding: 12px 20px;
    background: rgba(255,254,244,0.85);
    border: 1.5px solid #00a85f;
    border-radius: 50px;
    font-size: 15px;
    color: #00a85f;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
    line-height: 1.3;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .option-btn:active {
    transform: scale(0.98);
  }

  .option-btn.selected {
    background: #00a85f;
    color: #fff;
    border-color: #00a85f;
  }

  .option-btn .option-label {
    display: inline;
    font-weight: 600;
    margin-right: 2px;
  }

  .option-btn .option-desc {
    display: inline;
  }

  .quiz-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: transparent;
    padding: 10px 5vw calc(10px + var(--safe-bottom));
    display: flex;
    align-items: center;
    pointer-events: none;
  }

  .quiz-footer-inner {
    width: 100%;
    display: flex;
    align-items: center;
  }

  .quiz-footer-inner > * {
    pointer-events: auto;
  }

  .btn-prev {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 44px;
    padding: 0 12px;
    background: rgba(255,254,244,0.85);
    color: #00a85f;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s ease;
    font-family: inherit;
    font-weight: 500;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn-prev:active {
    opacity: 0.6;
  }

  /* ===== Result Page ===== */
  #result {
    display: none;
    position: relative;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  #result.fixed-bg {
    height: auto;
    min-height: 100dvh;
  }


  .result-content {
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    padding: calc(var(--safe-top) + 8px) 5vw calc(4vh + var(--safe-bottom) + 8px);
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .result-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
  }

  .result-actions {
    margin-top: auto;
  }




  .result-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .result-header-label {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    margin-bottom: 6px;
  }

  .result-mascot {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }

  .result-mascot img {
    width: min(150px, 40vw);
    height: auto;
    display: block;
  }

  .result-tagline {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #00a85f;
    line-height: 1.6;
    margin-bottom: 20px;
    text-shadow: 0 0 8px rgba(255,254,244,0.9);
  }

  .section-box {
    border: 2px solid #00a85f;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
    text-align: left;
    background: rgba(255,254,244,0.85);
  }

  .section-label {
    font-size: 15px;
    font-weight: 700;
    color: #00a85f;
    margin-bottom: 8px;
  }

  .section-content {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-light);
  }

  .result-actions {
    display: flex;
    flex-direction: row;
    gap: 50px;
    justify-content: flex-start;
    align-items: center;
    margin-top: auto;
    padding-left: 10px;
  }

  .result-actions button {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    font-family: inherit;
  }

  .result-actions button:active {
    transform: scale(0.97);
  }

  .result-actions button img {
    display: block;
    height: 100%;
    width: auto;
    margin: 0 auto;
  }

  .btn-restart {
    width: min(120px, 24vw);
    height: 36px;
  }

  .btn-share {
    width: min(160px, 28vw);
    height: 36px;
  }

  /* ===== Animations ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .fade-in-up { animation: fadeInUp 0.35s ease forwards; }
  .fade-in { animation: fadeIn 0.25s ease forwards; }
  .scale-in { animation: scaleIn 0.3s ease forwards; }

  /* ===== Confetti ===== */
  .confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 6px;
    height: 6px;
    top: -10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    to {
      transform: translateY(105vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* ===== QR Modal ===== */
  .qr-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 5vw;
  }

  .qr-overlay.show { display: flex; }

  .qr-modal {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    max-width: 300px;
    width: 100%;
    animation: scaleIn 0.25s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }

  .qr-modal h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .qr-modal p {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .qr-modal img {
    width: 180px;
    height: 180px;
    margin: 0 auto 16px;
    display: block;
    border-radius: 8px;
  }

  .qr-modal .btn-close-qr {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    min-width: 120px;
    padding: 0 28px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid #f0f0f0;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .qr-modal .btn-close-qr:active {
    border-color: var(--primary);
  }

  /* ===== Responsive small screens ===== */
  @media (max-width: 380px) {
    .intro-tagline p { font-size: 13px; }
    .intro-tagline p:last-child { font-size: 15px; }
    .question-text { font-size: 16px; }
    .option-btn { padding: 12px 14px; min-height: 46px; }
  }

  @media (min-width: 420px) {
    .types-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }

  @media (max-height: 640px) {
    #intro { gap: 0; }
    .intro-inner { gap: 1.5vh; padding: 3vw; }
    .intro-theme img { width: min(200px, 50vw); }
    .intro-tagline { width: min(200px, 50vw); }
    .intro-bottom-img img { width: 140px; }
    .btn-start { width: min(100px, 25vw); min-width: 100px; height: 40px; font-size: 16px; }
    .quiz-body { padding: 2vh 5vw 90px; }
  }
</style>
</head>

<!-- ==================== RESULT ==================== -->

      { label: 'B', text: '可以接受，但希望明天吃好点。', score: { J: 0.5, P: 0.5 } },
      { label: 'C', text: '完全可以，任务完成就行。', score: { J: 0, P: 1 } }
    ]
  },
  {
    q: '对你来说，吃饭更像？',
    dim: 'JP',
    options: [
      { label: 'A', text: '一天里值得认真对待的小片刻。', score: { J: 1, P: 0 } },
      { label: 'B', text: '有时是享受，有时是补能。', score: { J: 0.5, P: 0.5 } },
      { label: 'C', text: '给身体充电，别耽误正事。', score: { J: 0, P: 1 } }
    ]
  },
  {
    q: '如果一顿饭等太久、流程很复杂，你会？',
    dim: 'JP',
    options: [
      { label: 'A', text: '如果值得，也愿意慢慢等。', score: { J: 1, P: 0 } },
      { label: 'B', text: '看值不值得，不值得就换。', score: { J: 0.5, P: 0.5 } },
      { label: 'C', text: '直接失去耐心，吃饭别搞这么复杂。', score: { J: 0, P: 1 } }
    ]
  }
];

// ===== STATE =====
let currentQ = 0;
let answers = new Array(questions.length).fill(null);
let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

// ===== INIT =====
document.getElementById('qTotal').textContent = questions.length;

// ===== FUNCTIONS =====
function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'flex';
  currentQ = 0;
  renderQuestion();
  updateProgress();
}

function renderQuestion() {
  const q = questions[currentQ];
  const body = document.getElementById('quizBody');
  body.style.opacity = '0';

  setTimeout(() => {
    const optHtml = q.options.map((opt, i) => {
      const sel = answers[currentQ] === i ? 'selected' : '';
      return `<button class="option-btn ${sel}" onclick="selectOption(${i})">
        <span><span class="option-label">${opt.label}.</span> <span class="option-desc">${opt.text}</span></span>
      </button>`;
    }).join('');

    body.innerHTML = `
      <div class="fade-in-up" style="display:flex;flex-direction:column;flex:1;">
        <div class="question-box">
          <div class="question-text">${q.q}</div>
        </div>
        <div class="options">${optHtml}</div>
      </div>
    `;
    body.style.opacity = '1';
  }, 150);

  document.getElementById('btnPrev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';

  updateProgress();
}

function selectOption(idx) {
  answers[currentQ] = idx;

  // Show selected state immediately
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });

  // Disable further clicks during transition
  btns.forEach(btn => { btn.style.pointerEvents = 'none'; });

  setTimeout(() => {
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }, 250);
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('qCurrent').textContent = currentQ + 1;
  document.getElementById('qAnswered').textContent = answered;
}

function submitQuiz() {
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  questions.forEach((q, i) => {
    if (answers[i] !== null) {
      const s = q.options[answers[i]].score;
      for (let key in s) {
        scores[key] += s[key];
      }
    }
  });

  const result =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  showResult(result);
}

function showResult(code) {
  document.getElementById('quiz').style.display = 'none';
  document.body.classList.add('showing-result');



  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';
  document.querySelector('.result-content').style.backgroundImage = `url(颜色区分/${colorMap[code]}/0.jpg)`;

  const t = types[code];
  const desc = fullDesc[code];

  const dims = [
    { label: '内向 / 外向', l: 'I', r: 'E', lv: scores.I, rv: scores.E },
    { label: '感性 / 直觉', l: 'S', r: 'N', lv: scores.S, rv: scores.N },
    { label: '理性 / 感性', l: 'T', r: 'F', lv: scores.T, rv: scores.F },
    { label: '计划 / 随性', l: 'J', r: 'P', lv: scores.J, rv: scores.P }
  ];

  const dimHtml = dims.map(d => {
    const total = d.lv + d.rv || 1;
    const pct = Math.round((d.rv / total) * 100);
    const leftPct = Math.round((d.lv / total) * 100);
    const dimVal = code.includes(d.r) ? d.r : d.l;
    return `
      <div class="dimension-item scale-in">
        <div class="dimension-label">${d.label}</div>
        <div class="dimension-value ${dimVal.toLowerCase()}">${dimVal === d.r ? `${d.r} / ${d.l}` : `${d.l} / ${d.r}`}</div>
        <div class="dimension-bar">
          <div class="dimension-bar-fill ${pct > 50 ? 'right' : 'left'}"
               style="width:${Math.max(pct, leftPct)}%;"></div>
        </div>
        <div class="dimension-bar-labels">
          <span>${d.l} <small>${leftPct}%</small></span>
          <span><small>${pct}%</small> ${d.r}</span>
        </div>
      </div>
    `;
  }).join('');

  const allTypesHtml = Object.entries(types).map(([c, t]) => {
    const active = c === code ? 'style="border-color:var(--primary);background:var(--primary-light);"' : '';
    return `<div class="type-card-mini" ${active} onclick="showResult('${c}')">
      <div class="mini-code">${t.name}</div>
      <div class="mini-name">${t.tag}</div>
    </div>`;
  }).join('');

  document.getElementById('resultContent').innerHTML = `
    <div class="result-header scale-in" style="border-radius:8px;padding:12px;margin-bottom:0">
      <div class="result-header-label" style="font-size:13px;color:#999;margin-bottom:100px;margin-top:10px">您的测试结果</div>
      <div class="result-header-label">你的美食人格类型是</div>
      <div class="result-header-tag" style="color:${colorHex[colorMap[code]]};font-weight:700;font-size:56px;text-align:center;margin:4px 0">${t.tag}</div>
      <div class="result-header-name" style="color:#000;font-weight:700;font-size:20px;text-align:center;margin:2px 0 8px">${t.name}</div>
      <div class="result-header-quote" style="font-size:14px;text-align:center;color:#666;margin-bottom:12px;line-height:1.6">&#8220;${t.desc}&#8221;</div>
      <div class="result-mascot">
        <img src="人格图片/${code}.png" alt="" onerror="this.src='人格图片/${code}.jpg'">
      </div>
    </div>

    ${(() => {
      const idx = desc.indexOf('美食内核');
      const raw = idx !== -1 ? desc.substring(idx + 5).replace(/[：:]\s*/, '') : '';
      const keywords = raw.split(/[，、,]/).map(s => s.trim()).filter(Boolean);
      const color = colorMap[code];
      const hex = colorHex[color];
      const bgFile = color === '绿' ? `${color}/11.png` : `${color}/1.svg`;
      return `<div class="keyword-grid" style="border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center">
        ${keywords.map(k => `<div class="keyword-item" style="background-image:url(颜色区分/${bgFile});background-size:100%;background-repeat:no-repeat;background-position:center;width:30%;min-width:80px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;color:#333;display:flex;align-items:center;justify-content:center;min-height:44px">#${k}</div>`).join('')}
      </div>`;
    })()}

    ${(() => {
      const c = colorMap[code];
      const bg5 = c === '绿' ? `颜色区分/${c}/55.png` : `颜色区分/${c}/5.svg`;
      const icon3 = c === '绿' ? `颜色区分/${c}/33.png` : `颜色区分/${c}/3.svg`;
      const h = colorHex[c];
      const contentText = (() => {
        const idx = desc.indexOf('美食内核');
        return idx !== -1 ? desc.substring(0, idx) : desc;
      })();
      // 第一句加粗+颜色，剩余内容按句分段
      const firstDot = contentText.indexOf('。');
      const firstLine = firstDot !== -1 ? contentText.substring(0, firstDot + 1) : contentText;
      const restRaw = firstDot !== -1 ? contentText.substring(firstDot + 1).trim() : '';
      // 将剩余内容按句号/问号分段，每段独立一行
      const restParagraphs = restRaw.split(/(?<=[。！？])/).map(s => s.trim()).filter(Boolean);
      return `<div style="background-image:url(${bg5});background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:8px;padding:14px 12px;margin-bottom:14px;max-width:86%;margin-left:auto;margin-right:auto">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <img src="${icon3}" style="height:28px;width:auto;display:block">
          <span style="font-size:17px;font-weight:700;color:${h}">美食人格解读</span>
        </div>
        <img src="颜色区分/通用元素/虚线.svg" style="width:100%;display:block;margin-bottom:4px;margin-top:-5px">
        <div style="font-size:14px;line-height:1.3;color:var(--text-light)">
          <p style="font-weight:700;color:${h};margin:0 0 6px 0">${firstLine}</p>
          ${restParagraphs.map(p => `<p style="margin:0 0 4px 0">${p}</p>`).join('')}
        </div>
      </div>`;
    })()}

    ${(() => {
      const c = colorMap[code];
      const bg5 = c === '绿' ? `颜色区分/${c}/55.png` : `颜色区分/${c}/5.svg`;
      const icon3 = c === '绿' ? `颜色区分/${c}/33.png` : `颜色区分/${c}/3.svg`;
      const h = colorHex[c];
      const sympText = shortSymptoms[code];
      const firstDot = sympText.indexOf('。');
      const firstLine = firstDot !== -1 ? sympText.substring(0, firstDot + 1) : sympText;
      const restRaw = firstDot !== -1 ? sympText.substring(firstDot + 1).trim() : '';
      const restParagraphs = restRaw.split(/(?<=[。！？])/).map(s => s.trim()).filter(Boolean);
      return `<div style="background-image:url(${bg5});background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:8px;padding:14px 12px;margin-bottom:14px;max-width:86%;margin-left:auto;margin-right:auto">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <img src="${icon3}" style="height:28px;width:auto;display:block">
          <span style="font-size:17px;font-weight:700;color:${h}">人格典型症状</span>
        </div>
        <img src="颜色区分/通用元素/虚线.svg" style="width:100%;display:block;margin-bottom:4px;margin-top:-5px">
        <div style="font-size:14px;line-height:1.3;color:var(--text-light)">
          <p style="margin:0 0 6px 0">${firstLine}</p>
          ${restParagraphs.map(p => `<p style="margin:0 0 4px 0">${p}</p>`).join('')}
        </div>
      </div>`;
    })()}

    <div class="result-actions" style="border-radius:8px;padding:12px;margin-top:10px">
      <button class="btn-restart" onclick="restartQuiz()"><img src="颜色区分/${colorMap[code]}/6.svg" alt="再测一次" onerror="this.src='颜色区分/${colorMap[code]}/66.png'"></button>
      <button class="btn-share" onclick="showQR()"><img src="颜色区分/${colorMap[code]}/7.svg" alt="分享给朋友" onerror="this.src='颜色区分/${colorMap[code]}/77.png'"></button>
    </div>
  `;

  launchConfetti();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  document.body.classList.remove('showing-result');
  document.getElementById('result').style.display = 'none';
  document.querySelector('.result-content').style.backgroundImage = '';
  document.getElementById('intro').style.display = 'flex';
  window.scrollTo({ top: 0 });
}

function launchConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  const colors = ['#1ca05c', '#4CAF50', '#81C784', '#ffb74d', '#4A90D9', '#7CB342', '#AB47BC', '#E91E63'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (Math.random() * 6 + 4) + 'px';
    piece.style.height = (Math.random() * 6 + 4) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 1.5) + 's';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 4000);
}

// ===== QR Code Share =====
function showQR() {
  const overlay = document.getElementById('qrOverlay');
  const img = document.getElementById('qrImg');
  const url = window.location.href;
  document.getElementById('qrUrl').textContent = url;
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
  overlay.classList.add('show');
}

function closeQR() {
  document.getElementById('qrOverlay').classList.remove('show');
}
</script>

<!-- ===== QR Modal ===== -->
<div class="qr-overlay" id="qrOverlay" onclick="if(event.target===this)closeQR()">
  <div class="qr-modal">
    <h3>掏手机扫一扫</h3>
    <p>让朋友也来测试你的美食人格</p>
    <img id="qrImg" src="" alt="QR Code">
    <p style="font-size:12px;color:#999;word-break:break-all;margin-bottom:16px" id="qrUrl"></p>
    <button class="btn-close-qr" onclick="closeQR()">关闭</button>
  </div>
</div>

</body>
</html>
